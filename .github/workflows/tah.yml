# Tah ostreho behu (BUILD.md cast 6). Spousti ho rozvrh.yml (source = rozvrh), nebo clovek rucne.
# V Actions obsahuje jen skutecne tahy, kroniky a rucni suche behy; filtruje se pres Workflow -> tah.
# Klic jde jen do promenne prostredi kroku; zadny krok netiskne env ani secrets.

name: tah
run-name: "${{ inputs.source == 'rozvrh' && 'tah' || format('ručně {0}', inputs.mode) }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "turn = odehrát tah, dry-model = jen prompty bez API"
        required: true
        default: turn
        type: choice
        options:
          - turn
          - dry-model
      source:
        description: "kdo běh spustil (rozvrh = podle rozvrhu, ručně = bez ohledu na rozvrh)"
        required: false
        default: ručně
        type: choice
        options:
          - ručně
          - rozvrh

permissions:
  contents: write

concurrency:
  group: tah
  cancel-in-progress: false

jobs:
  tah:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pojistka proti dvojimu tahu: po checkoutu (aktualni state.json) se rozvrh prepocita.
      # Rucni turn hraje bez ohledu na rozvrh (--force).
      - name: Rozvrh
        id: plan
        if: inputs.mode == 'turn'
        run: python run_turn.py --schedule-check ${{ inputs.source != 'rozvrh' && '--force' || '' }}

      - name: Závislosti
        if: inputs.mode == 'dry-model' || steps.plan.outputs.plan == 'hrat' || steps.plan.outputs.plan == 'kronika'
        run: pip install anthropic

      - name: Suchý běh (jen prompty, bez API)
        if: inputs.mode == 'dry-model'
        run: python run_turn.py --dry-model

      - name: Prompty suchého běhu jako artefakt
        if: inputs.mode == 'dry-model'
        uses: actions/upload-artifact@v4
        with:
          name: debug-prompty
          path: debug/

      - name: Tah
        id: tah
        if: steps.plan.outputs.plan == 'hrat'
        env:
          ARDAN_API_KEY: ${{ secrets.ARDAN_API_KEY }}
        run: python run_turn.py --scheduled ${{ inputs.source != 'rozvrh' && '--force' || '' }}

      - name: Commit tahu
        if: steps.tah.outputs.played != '' && steps.tah.outputs.played != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898789+github-actions[bot]@users.noreply.github.com"
          git add state.json history
          if [ -f docs/rulings.md ]; then git add docs/rulings.md; fi
          git commit -m "${{ steps.tah.outputs.label }}"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Kronika dne
        id: kronika
        if: steps.tah.outputs.chronicle_day != '' || steps.plan.outputs.plan == 'kronika'
        env:
          ARDAN_API_KEY: ${{ secrets.ARDAN_API_KEY }}
        run: python run_chronicle.py --day ${{ steps.tah.outputs.chronicle_day || steps.plan.outputs.chronicle_day }}

      - name: Commit kroniky
        if: steps.kronika.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898789+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain chronicle)" ]; then
            git add chronicle
            git commit -m "kronika dne ${{ steps.tah.outputs.chronicle_day || steps.plan.outputs.chronicle_day }}"
            git pull --rebase origin master
            git push origin HEAD:master
          else
            echo "kronika se nezapsala (chybí některý snímek dne, pravidla 10.7)"
          fi

      - name: Shrnutí běhu
        if: always()
        run: echo "${{ steps.tah.outputs.label || steps.plan.outputs.label || 'suchý běh' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Neúspěšné pokusy a selhaný tah jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostika-${{ github.run_id }}
          path: |
            debug/*_fail_*.txt
            history/failed_turn_*.json
          if-no-files-found: ignore
