# Planovac ostreho behu (BUILD.md cast 6).
# Cron bezi kazdych 30 minut, rozvrh si skript spocita sam ze state.json (meta.day1_date a sloty
# 07:00, 13:00 a 20:00 prazskeho casu). Zameskany slot se tak dohoni do 30 minut.
# Klic jde jen do promenne prostredi kroku; zadny krok netiskne env ani secrets.

name: tah
run-name: ${{ github.event_name == 'workflow_dispatch' && format('ruční: {0}', inputs.mode) || 'rozvrh' }}

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "turn = odehrát tah bez ohledu na rozvrh, dry-model = jen prompty bez API"
        required: true
        default: turn
        type: choice
        options:
          - turn
          - dry-model

permissions:
  contents: write

concurrency:
  group: tah
  cancel-in-progress: false

jobs:
  tah:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Rozhoduje se jeste pred pip install, jen ze state.json: prazdny beh je hotovy za par sekund.
      - name: Rozvrh
        id: plan
        if: github.event_name == 'schedule' || inputs.mode == 'turn'
        run: python run_turn.py --schedule-check ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'turn') && '--force' || '' }}

      - name: Závislosti
        if: inputs.mode == 'dry-model' || steps.plan.outputs.plan == 'hrat' || steps.plan.outputs.plan == 'kronika'
        run: pip install anthropic

      - name: Suchý běh (jen prompty, bez API)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-model'
        run: python run_turn.py --dry-model

      - name: Prompty suchého běhu jako artefakt
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-model'
        uses: actions/upload-artifact@v4
        with:
          name: debug-prompty
          path: debug/

      - name: Tah
        id: tah
        if: steps.plan.outputs.plan == 'hrat'
        env:
          ARDAN_API_KEY: ${{ secrets.ARDAN_API_KEY }}
        run: python run_turn.py --scheduled ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'turn') && '--force' || '' }}

      - name: Commit tahu
        if: steps.tah.outputs.played != '' && steps.tah.outputs.played != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898789+github-actions[bot]@users.noreply.github.com"
          git add state.json history
          if [ -f docs/rulings.md ]; then git add docs/rulings.md; fi
          git commit -m "${{ steps.tah.outputs.label }}"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Kronika dne
        id: kronika
        if: steps.tah.outputs.chronicle_day != '' || steps.plan.outputs.plan == 'kronika'
        env:
          ARDAN_API_KEY: ${{ secrets.ARDAN_API_KEY }}
        run: python run_chronicle.py --day ${{ steps.tah.outputs.chronicle_day || steps.plan.outputs.chronicle_day }}

      - name: Commit kroniky
        if: steps.kronika.outcome == 'success' && (steps.tah.outputs.chronicle_day != '' || steps.plan.outputs.plan == 'kronika')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898789+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain chronicle)" ]; then
            git add chronicle
            git commit -m "kronika dne ${{ steps.tah.outputs.chronicle_day || steps.plan.outputs.chronicle_day }}"
            git pull --rebase origin master
            git push origin HEAD:master
          else
            echo "kronika se nezapsala (chybí některý snímek dne, pravidla 10.7)"
          fi

      # Vysledek behu do shrnuti, aby se dal poznat bez otevirani logu.
      - name: Shrnutí běhu
        if: always()
        run: echo "${{ steps.tah.outputs.label || steps.plan.outputs.label || 'suchý běh' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Neúspěšné pokusy a selhaný tah jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostika-${{ github.run_id }}
          path: |
            debug/*_fail_*.txt
            history/failed_turn_*.json
          if-no-files-found: ignore
