<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Ardan · hra od Kája Industries</title>
<meta name="description" content="Ardan: tři vlády řízené umělou inteligencí ve světě, který jde od rozmachu ke krachu. Sleduj mapu kolo po kole, čti projevy i to, co si vlády doopravdy myslí.">
<meta property="og:type" content="website">
<meta property="og:title" content="Ardan · hra od Kája Industries">
<meta property="og:description" content="Tři vlády řízené umělou inteligencí. Ty vidíš i to, co si myslí.">
<meta property="og:url" content="https://cvaliik.github.io/diplomacie-agentu/web/">
<meta property="og:image" content="https://cvaliik.github.io/diplomacie-agentu/web/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="brand/kaja-k.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@100..125,200..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="kaja.css">
<style>
  /* vedlejší text na skle: Steel by nad mapou nedal kontrast 4,5:1, proto tmavší odstín a hustší sklo */
  :root { --steel-sklo: #5A616B; --hore: 132px; --dole: 84px; }
  .sklo { background: rgba(255, 255, 255, .86); }
  .sklo .hud, .sklo small, .sklo .sipka, .sklo .znacka-den span, .sklo .vys { color: var(--steel-sklo); }
  .sklo .vys { border-color: var(--steel-sklo); }
  html, body { height: 100%; }
  body { max-width: none; padding: 0; overflow: hidden; }
  .scena { position: fixed; inset: 0; }
  /* síť hvězd jen v okrajích viewportu: maska je uprostřed průhledná, mapa i texty leží mimo ni */
  .plexus-okraj { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
                  -webkit-mask-image: radial-gradient(ellipse 72% 70% at 50% 52%, transparent 62%, #000 100%);
                  mask-image: radial-gradient(ellipse 72% 70% at 50% 52%, transparent 62%, #000 100%); }
  .plexus-okraj line { stroke: var(--steel); stroke-width: .75; }
  .plexus-okraj circle { fill: var(--steel); }
  #platno { position: absolute; inset: 0; }
  #platno canvas { display: block; outline: none; }
  #popisky { position: absolute; inset: 0; pointer-events: none; z-index: 1; }   /* vlastní vrstva: CSS2DRenderer dává popiskům vysoký z-index */
  .popisek { font-family: var(--saira); font-weight: 500; font-stretch: 110%; font-size: 12px; letter-spacing: .14em;
             text-transform: uppercase; color: var(--graphite); white-space: nowrap; pointer-events: none;
             text-shadow: 0 0 3px #FBFBFC, 0 0 3px #FBFBFC, 0 0 2px #FBFBFC; }
  .popisek span { display: block; transform: translateY(-18px); }
  .popisek.hrac { font-size: 13px; }
  .popisek.jezero { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .22em; color: var(--steel-sklo); }
  .popisek.jezero span { transform: none; }

  /* ------------------------------ horní lišta ------------------------------ */
  .hore { position: absolute; top: 0; left: 0; right: 0; padding: 10px 16px 0; pointer-events: none; z-index: 3; }
  .hore > * { pointer-events: auto; }
  .znak { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 8px; }
  .znak .monogram { display: block; width: 32px; }
  .hud-lista { display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none; }
  .hud-lista::-webkit-scrollbar { display: none; }
  .hud-lista .pole { padding: 8px 14px 9px; border-left: 1px solid var(--silver); display: flex; flex-direction: column;
                     gap: 1px; min-width: max-content; }
  .hud-lista .pole:first-child { border-left: 0; }
  .hud-lista .pole b { font-weight: 500; font-size: 20px; line-height: 1.2; font-stretch: 110%; font-variant-numeric: tabular-nums; }
  .hud-lista .pole small { font-size: 12px; color: var(--steel); line-height: 1.3; }
  .hud-lista .pole-faze b { font-size: 16px; font-stretch: 100%; padding-top: 3px; }
  .hud-lista .odkazy { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-left: 1px solid var(--silver); }
  .hud-lista .odkazy a, .hud-lista .odkazy button { white-space: nowrap; }
  .sipka { color: var(--steel); font-weight: 400; font-size: 15px; }

  /* ------------------------------ bublina co se stalo ------------------------------ */
  #bublina-kola { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); max-width: min(620px, calc(100% - 32px));
                  background: var(--white); border: 1px solid var(--silver); padding: 8px 14px; font-size: 16px; line-height: 1.5;
                  cursor: pointer; z-index: 2; text-align: center; }
  #bublina-kola .hud { display: block; margin-bottom: 2px; }

  /* ------------------------------ tooltip ------------------------------ */
  #tooltip { position: absolute; z-index: 5; pointer-events: none; background: var(--white); border: 1px solid var(--silver);
             padding: 8px 10px; font-size: 14px; line-height: 1.45; min-width: 170px; }
  #tooltip b { display: block; font-weight: 500; font-stretch: 110%; text-transform: uppercase; letter-spacing: .12em; font-size: 13px;
               line-height: 1.3; margin-bottom: 6px; }
  #tooltip .radek { display: flex; justify-content: space-between; gap: 12px; }
  #tooltip .radek span:first-child { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .16em;
                                     text-transform: uppercase; color: var(--steel); }

  /* ------------------------------ lišta kol ------------------------------ */
  .dolni-lista { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(920px, calc(100% - 32px));
                 display: flex; align-items: center; gap: 10px; padding: 10px 14px; z-index: 2; }
  .lista { flex: 1; min-width: 0; position: relative; padding-bottom: 20px; }
  .lista input[type=range] { width: 100%; margin: 0; accent-color: var(--ion); }
  .znacky { position: absolute; left: 8px; right: 8px; top: 22px; height: 16px; }
  .znacka-den { position: absolute; top: 0; width: 1px; height: 5px; background: var(--silver); }
  .znacka-den span { position: absolute; top: 7px; transform: translateX(-50%); font-family: var(--mono); font-size: 10px;
                     color: var(--steel); letter-spacing: .08em; white-space: nowrap; }
  .znacka-faze { position: absolute; top: -10px; width: 2px; height: 16px; background: var(--ion); transform: translateX(-1px); cursor: help; }
  .znacka-faze b { display: none; position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-family: var(--mono);
                   font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--graphite);
                   background: var(--white); border: 1px solid var(--silver); padding: 3px 6px; white-space: nowrap; }
  .znacka-faze:hover b, .znacka-faze:focus b { display: block; }
  #cas { min-width: 10em; text-align: right; }
  #cas .hud { display: block; }
  #cas b { font-weight: 500; font-stretch: 110%; font-size: 15px; }
  .ikona, .krizek { display: none; }

  /* ------------------------------ panel státu ------------------------------ */
  /* panel a překryvy leží mezi horní lištou a lištou kol (--hore a --dole měří mapa.js), obě lišty zůstávají použitelné */
  #panel { position: absolute; top: var(--hore); right: 16px; bottom: var(--dole); width: 380px; background: var(--white); border: 1px solid var(--silver);
           z-index: 6; overflow-y: auto; padding: 16px 18px 24px; }
  #panel h2 { margin: 0 0 4px; border: 0; padding: 0; font-size: 16px; }
  #panel .zavrit { position: absolute; top: 12px; right: 12px; }
  #panel .tlacitko-projev { margin-top: 10px; }
  #panel table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  #panel td { padding: 4px 0; vertical-align: top; font-size: 15px; line-height: 1.45; }
  #panel td:first-child { width: 44%; padding-right: 8px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .14em;
                          text-transform: uppercase; color: var(--steel); }
  #panel .oddil td { padding-top: 14px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .22em;
                     text-transform: uppercase; color: var(--graphite); border-bottom: 1px solid var(--silver); }

  /* ------------------------------ překryvy (projevy, kronika) ------------------------------ */
  .prekryv { position: absolute; top: var(--hore); bottom: var(--dole); left: 0; right: 0; z-index: 8; background: rgba(243, 244, 246, .6); overflow-y: auto; padding: 16px; }
  .prekryv-hlava { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: -16px; z-index: 1;
                   margin: -16px -16px 12px; padding: 12px max(16px, calc((100% - 1200px) / 2)); background: var(--hull);
                   border-bottom: 1px solid var(--silver); }
  .prekryv-hlava h2 { margin: 0; border: 0; padding: 0; margin-right: auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kronika-popis { display: block; max-width: calc(68ch + 48px); margin: 0 auto 8px; }
  .karta { scroll-margin-top: 72px; }   /* pod lepící hlavičkou překryvu */
  .karta.cil { outline: 2px solid var(--ion); outline-offset: 2px; }
  .karty { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
  .karta { background: var(--white); border: 1px solid var(--silver); padding: 14px 16px; min-width: 0; }
  .karta h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
  .karta h3 .ctverec { width: 10px; height: 10px; flex: none; }
  .otazka { border-left: 2px solid var(--steel); padding: 2px 0 2px 12px; margin: 6px 0 10px; }
  .otazka p { margin: 4px 0 0; font-style: italic; }
  .projev { margin: 6px 0 10px; padding-left: 12px; border-left: 3px solid var(--graphite); }
  .zapis { background: rgba(200, 205, 212, .25); padding: 8px 12px; margin: 8px 0; }
  .zapis p { margin: 6px 0 0; }
  .zapis button, .cist-dal { margin-top: 6px; padding: 4px 8px; font-size: 11px; }
  details.spis { margin: 6px 0; }
  details.spis summary { cursor: pointer; }
  .seznam { margin: 2px 0 8px; padding-left: 18px; }
  .seznam li { margin: 3px 0; }
  .stitek-v { display: inline-block; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
              border: 1px solid var(--graphite); color: var(--graphite); padding: 0 6px; margin-left: 6px; line-height: 1.6; vertical-align: 1px; }
  .stitek-v.slaby { border-color: var(--steel); color: var(--steel); }
  .duvod { color: var(--steel); }
  .kronika-text { background: var(--white); border: 1px solid var(--silver); max-width: calc(68ch + 48px); margin: 0 auto;
                  padding: 18px 24px; font-size: 17px; line-height: 1.65; }
  .kronika-text h1 { font-size: 18px; margin: 4px 0 12px; }
  .kronika-text h2 { font-size: 14px; }
  .kronika-text em { font-style: normal; }
  select { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
           border: 1px solid var(--graphite); background: var(--white); color: var(--graphite); padding: 6px 8px; border-radius: 0; }

  /* ------------------------------ průvodce první návštěvou ------------------------------ */
  #pruvodce { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
  #pruvodce-cil { position: absolute; border: 2px solid var(--ion); box-shadow: 0 0 0 9999px rgba(34, 37, 42, .28); pointer-events: none; }
  #pruvodce-karta { position: absolute; width: min(360px, calc(100% - 32px)); padding: 14px 16px 12px; pointer-events: auto;
                    font-family: var(--saira); font-size: 17px; line-height: 1.5; }
  #pruvodce-karta p { margin: 4px 0 12px; }
  #pruvodce-karta .tlacitka { display: flex; gap: 8px; justify-content: flex-end; }
  @media (prefers-reduced-motion: no-preference) {
    #pruvodce-cil, #pruvodce-karta { transition: top .25s ease, left .25s ease, width .25s ease, height .25s ease; }
  }

  /* území pro klávesnici: neviditelná tlačítka v pořadí map.json */
  .uzemi-klavesnice { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .bez-webgl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }

  @media (max-width: 599px) {
    .hore { padding: 8px 10px 0; }
    .hud-lista .pole { padding: 6px 10px 7px; }
    .hud-lista .pole b { font-size: 17px; }
    .dolni-lista { left: 0; right: 0; bottom: 0; transform: none; width: 100%; padding: 8px 10px; gap: 6px; }
    .dolni-lista button { padding: 7px 9px; }
    .lista { padding-bottom: 10px; }
    .znacky { top: 20px; }
    .znacka-den span { display: none; }
    #cas { min-width: 0; }
    #cas .hud { display: none; }
    .text-prehrat { display: none; }
    .ikona { display: inline; }
    #bublina-kola { bottom: 64px; font-size: 15px; }
    :root { --dole: 58px; }
    #panel { top: auto; left: 0; right: 0; width: 100%; bottom: var(--dole); height: min(60%, calc(100% - var(--hore) - var(--dole)));
             border: 0; border-top: 1px solid var(--silver); }
    .karty { grid-template-columns: 1fr; }
    .prekryv { padding: 10px; }
    .prekryv-hlava { flex-wrap: nowrap; gap: 6px; margin: -10px -10px 10px; padding: 8px 10px; top: -10px; }
    .prekryv-hlava h2 { font-size: 13px; letter-spacing: .14em; }
    .prekryv-hlava button { padding: 7px 9px; }
    .prekryv-hlava select { padding: 6px 4px; }
    .zavrit-prekryv .slovo { display: none; }
    .zavrit-prekryv .krizek { display: inline; }
    .kronika-text { padding: 14px 16px; font-size: 16px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="scena" id="scena">
  <svg class="plexus-okraj" id="plexus-okraj" aria-hidden="true"></svg>
  <div id="platno" role="img" aria-label="Trojrozměrná mapa světa Ardan"></div>
  <div id="popisky"></div>
  <div id="tooltip" hidden></div>
  <div class="uzemi-klavesnice" id="klavesnice" role="group" aria-label="Státy a jejich hlavní města"></div>

  <div class="hore">
    <a class="znak" href="./" aria-label="Ardan, hra od Kája Industries">
      <span class="monogram" data-svg="brand/kaja-k.svg" data-prefix="mg"></span>
      <span class="hud">Ardan</span>
    </a>
    <div class="hud-lista sklo" id="hud-lista" role="region" aria-label="Stav světa">
      <div class="pole"><span class="hud">Kolo</span><b id="h-kolo">–</b><small id="h-rok"></small></div>
      <div class="pole pole-faze"><span class="hud">Fáze<button type="button" class="vys" data-pojem="fáze" aria-label="Co je fáze">?</button></span><b id="h-faze">–</b></div>
      <div class="pole"><span class="hud">Index<button type="button" class="vys" data-pojem="index prosperity" aria-label="Co je index prosperity">?</button></span><b id="h-index">–</b></div>
      <div class="pole"><span class="hud">Orit</span><b id="h-orit">–</b></div>
      <div class="pole"><span class="hud">Banky</span><b id="h-banky">–</b><small>kalverské / Aurelie</small></div>
      <div class="odkazy">
        <button type="button" id="o-projevy">Projevy</button>
        <button type="button" id="o-kronika">Kronika</button>
        <a class="tlacitko" href="o-hre.html">O hře</a>
        <a class="tlacitko" href="text.html">Textová verze</a>
      </div>
    </div>
  </div>

  <div id="bublina-kola" role="status" hidden></div>

  <div class="dolni-lista sklo" id="lista" role="region" aria-label="Kola hry" hidden>
    <button type="button" id="zpet" aria-label="Předchozí kolo">◀</button>
    <button type="button" id="dal" aria-label="Další kolo">▶</button>
    <button type="button" id="prehrat" aria-pressed="false" aria-label="Přehrát kola"><span class="text-prehrat">Přehrát</span><span class="ikona" aria-hidden="true">▶▶</span></button>
    <div class="lista">
      <input type="range" id="posuvnik" min="1" max="1" value="1" aria-label="Kolo">
      <div class="znacky" id="znacky" aria-hidden="true"></div>
    </div>
    <div id="cas"><span class="hud" id="cas-rok"></span><b id="cas-kolo"></b></div>
  </div>

  <aside id="panel" hidden aria-label="Panel státu"></aside>

  <section class="prekryv" id="projevy" role="dialog" hidden aria-label="Projevy a důvěrné zápisy vlád">
    <div class="prekryv-hlava">
      <h2 id="projevy-nadpis">Projevy</h2>
      <button type="button" id="p-zpet" aria-label="Předchozí kolo">◀</button>
      <button type="button" id="p-dal" aria-label="Další kolo">▶</button>
      <button type="button" class="zavrit-prekryv" aria-label="Zavřít projevy"><span class="slovo">Zavřít</span><span class="krizek" aria-hidden="true">×</span></button>
    </div>
    <div class="karty" id="karty"></div>
  </section>

  <section class="prekryv" id="kronika" role="dialog" hidden aria-label="Kronika">
    <div class="prekryv-hlava">
      <h2>Kronika</h2>
      <select id="kronika-den" aria-label="Rok kroniky"></select>
      <button type="button" class="zavrit-prekryv" aria-label="Zavřít kroniku"><span class="slovo">Zavřít</span><span class="krizek" aria-hidden="true">×</span></button>
    </div>
    <span class="hud kronika-popis" id="kronika-popis"></span>
    <article class="kronika-text" id="kronika-text"></article>
  </section>

  <div id="pruvodce" hidden>
    <div id="pruvodce-cil"></div>
    <div id="pruvodce-karta" class="sklo" role="dialog" aria-labelledby="pruvodce-krok" aria-describedby="pruvodce-text">
      <span class="hud" id="pruvodce-krok">Průvodce · 1 / 3</span>
      <p id="pruvodce-text"></p>
      <div class="tlacitka">
        <button type="button" id="pruvodce-preskocit">Přeskočit</button>
        <button type="button" id="pruvodce-dal">Dál</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="slovnik.js"></script>
<script src="kaja.js"></script>
<script type="module" src="mapa.js"></script>
</body>
</html>
